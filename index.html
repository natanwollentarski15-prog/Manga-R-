<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga R</titl
  <style>
    body {
      font-family: Arial, sans-serif;
      background: 
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    h1 {
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <h1>Manga R, bring your manga to life.</h1>
  
  <input type="file" id="imageInput" accept="image/*">
  
  <br><br>
  <img id="preview" style="display: none; max-width: 400px; margin-top: 20px; border-radius: 8px;">
  
  <br><br>
  <button id="playButton">Play Manga</button>
  
  <p id="status">Upload an image to get started.</p>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const playButton = document.getElementById('playButton');
    const status = document.getElementById('status');

    imageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
          status.textContent = 'Image loaded. Ready to play!';
        };
        reader.readAsDataURL(file);
      }
    });

    playButton.addEventListener('click', function () {
      if (preview.src) {
        status.textContent = 'Playing manga... (demo)';
      } else {
        status.textContent = 'Please upload an image first.';
      }
    });
  </script>
</body>
